# Supabase local development config for drobie.
# Hosted project settings (auth providers, SMTP via Resend, MFA) are set in the
# dashboard; Step 3 produces the full checklist.
project_id = "drobie"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "server"]   # server: service-role only; private and audit never exposed
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://drobie.app"
additional_redirect_urls = ["drobie://auth-callback", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
otp_expiry = 600

[auth.sms]
enable_signup = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[functions.health]
verify_jwt = false

[functions.config-bundle]
verify_jwt = false
