name: database
on:
  pull_request:
    paths: ["supabase/**", "scripts/db/**", ".github/workflows/database.yml"]
  push:
    branches: [main]
    paths: ["supabase/**", "scripts/db/**"]

jobs:
  migrations-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start database
        run: supabase db start
      - name: Apply migrations and seed from scratch
        run: supabase db reset
      - name: pgTAP suite
        run: supabase test db
      - name: Concurrency checks
        run: bash scripts/db/concurrency-test.sh postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Migrations must not be edited after merge
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed=$(git diff --name-only --diff-filter=MD "origin/${{ github.base_ref }}" -- supabase/migrations || true)
          if [ -n "$changed" ]; then echo "Edited or deleted existing migrations:"; echo "$changed"; exit 1; fi
